<g opacity="0"><set attributeName="opacity" to="1" begin="8.1s"/>
<text x="36" y="748"><tspan fill="#d97757">⏺</tspan><tspan fill="#e8e6e3"> He patches the layer where agents meet real processes — streaming parsers,</tspan></text></g>
