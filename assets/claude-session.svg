<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 870" role="img" aria-label="A Claude Code terminal session replaying tomsen-ai's track record: 1 merged in qwen-code (streaming tool-call parser, maintainer-verified E2E), 5 merged and 8 in flight in omnigent (harness runtime, kimi and qwen native forwarders), 2 merged in OpenHands SDK, 1 merged in OpenHands, 6 in flight with 3 approvals in open-design. House rules: daily-drive what you patch; issue first, minimal diff; prove it twice; one niche dug deep — the agent-process boundary. Shenzhen, UTC+8." font-family="'SF Mono','Cascadia Code','Courier New',monospace" font-size="17" xml:space="preserve">
<rect x="0" y="0" width="1000" height="870" rx="14" fill="#1f1e1d"/>
<rect x="1" y="1" width="998" height="868" rx="14" fill="none" stroke="#3d3a37" stroke-width="2"/>

<!-- welcome box: always visible -->
<rect x="30" y="34" width="620" height="102" rx="8" fill="none" stroke="#d97757" stroke-width="1.5"/>
<text x="48" y="66"><tspan fill="#d97757">✻</tspan><tspan fill="#e8e6e3" font-weight="bold"> Welcome to Claude Code!</tspan></text>
<text x="48" y="94" fill="#8a8580">  /help for help, /status for your current setup</text>
<text x="48" y="120" fill="#8a8580">  cwd: /home/shizai/agent-runtime</text>

<!-- user prompt, typed out character-window style -->
<g opacity="0"><set attributeName="opacity" to="1" begin="0.4s"/>
<text x="36" y="178" fill="#8a8580">&gt; </text>
<clipPath id="type"><rect x="56" y="160" width="0" height="26"><animate attributeName="width" values="0;30;62;96;128;160;192;224;250" keyTimes="0;0.12;0.25;0.37;0.5;0.62;0.75;0.87;1" calcMode="discrete" begin="0.4s" dur="1.1s" fill="freeze"/></rect></clipPath>
<text x="56" y="178" fill="#e8e6e3" font-weight="bold" clip-path="url(#type)">tell me about tomsen-ai</text>
</g>

<!-- thinking spinner: appears, cycles, then vanishes when results arrive -->
<g opacity="0"><set attributeName="opacity" to="1" begin="1.7s"/><set attributeName="opacity" to="0" begin="3.1s"/>
<text x="36" y="220" fill="#d97757"><tspan>✻<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.5s" begin="1.7s" repeatCount="3"/></tspan></text>
<text x="52" y="220" fill="#d97757"> Cogitating…<set attributeName="opacity" to="0" begin="2.4s"/></text>
<text x="52" y="220" fill="#d97757" opacity="0"> Reticulating…<set attributeName="opacity" to="1" begin="2.4s"/><set attributeName="opacity" to="0" begin="3.1s"/></text>
<text x="230" y="220" fill="#6a6560" font-size="14">(esc to interrupt · <tspan>↓ 0.8k tokens<set attributeName="opacity" to="0" begin="2.4s"/></tspan><tspan opacity="0" dx="-118">↓ 2.3k tokens<set attributeName="opacity" to="1" begin="2.4s"/></tspan>)</text>
</g>

<!-- tool call 1 -->
<g opacity="0"><set attributeName="opacity" to="1" begin="3.2s"/>
<text x="36" y="258"><tspan fill="#d97757">⏺</tspan><tspan fill="#e8e6e3" font-weight="bold"> Bash</tspan><tspan fill="#8a8580">(gh search prs --author tomsen-ai --state merged)</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="3.5s"/>
