<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-label="ZaiCode — a terminal session. whoami: agent engineer at a Shenzhen AI startup, focus on agent runtime reliability. gh stats table: qwen-code 1 merged; omnigent 5 merged, 8 in flight, 12 issues; OpenHands SDK 2 merged, 4 in flight, 3 issues; OpenHands 1 merged; open-design 6 in flight; total 9 merged, 19 in flight, 16 issues." font-family="'SF Mono','Cascadia Code','Courier New',monospace" font-size="20" xml:space="preserve">
<rect x="0" y="0" width="1000" height="800" rx="14" fill="#1f1e1d"/>
<rect x="1" y="1" width="998" height="798" rx="14" fill="none" stroke="#3d3a37" stroke-width="2"/>

<!-- pixel avatar: black hair, glasses, white collar, slate cardigan -->
<g transform="translate(48,40)">
<g fill="#26262a"><rect x="30" y="0" width="60" height="10"/><rect x="20" y="10" width="80" height="20"/><rect x="20" y="30" width="10" height="30"/><rect x="90" y="30" width="10" height="30"/></g>
<g fill="#f2c9a1"><rect x="30" y="30" width="60" height="10"/><rect x="30" y="50" width="60" height="10"/><rect x="30" y="60" width="60" height="10"/><rect x="40" y="70" width="40" height="10"/><rect x="50" y="80" width="20" height="10"/></g>
<g fill="#1d1d20"><rect x="30" y="40" width="10" height="10"/><rect x="50" y="40" width="20" height="10"/><rect x="80" y="40" width="10" height="10"/></g>
<g fill="#b7d3e8"><rect x="40" y="40" width="10" height="10"/><rect x="70" y="40" width="10" height="10"/></g>
<rect x="50" y="66" width="20" height="6" fill="#d29073"/>
<g fill="#414b5c"><rect x="10" y="80" width="30" height="10"/><rect x="80" y="80" width="30" height="10"/><rect x="0" y="90" width="50" height="10"/><rect x="70" y="90" width="50" height="10"/><rect x="0" y="100" width="120" height="20"/></g>
<g fill="#f5f3ee"><rect x="40" y="80" width="10" height="10"/><rect x="70" y="80" width="10" height="10"/><rect x="50" y="90" width="20" height="10"/></g>
</g>

<text x="200" y="104" font-size="46" font-weight="bold"><tspan fill="#d97757">Zai</tspan><tspan fill="#e8e6e3">Code</tspan></text>
<text x="202" y="140" fill="#8a8580" font-size="18">agent runtime reliability · Shenzhen</text>

<!-- welcome box -->
<rect x="36" y="188" width="640" height="106" rx="8" fill="none" stroke="#d97757" stroke-width="1.5"/>
<text x="56" y="224"><tspan fill="#d97757">✻</tspan><tspan fill="#e8e6e3" font-weight="bold"> Welcome to ZaiCode!</tspan></text>
<text x="56" y="252" fill="#8a8580" font-size="17">  /help for help, /status for your current setup</text>
<text x="56" y="278" fill="#8a8580" font-size="17">  cwd: /home/zai/agent-runtime</text>

<!-- exchange 1: whoami -->
<g opacity="0"><set attributeName="opacity" to="1" begin="0.8s"/>
<text x="36" y="348" fill="#8a8580">&gt; </text>
<clipPath id="t1"><rect x="60" y="328" width="0" height="28"><animate attributeName="width" values="0;12;24;36;48;60;74" keyTimes="0;0.16;0.33;0.5;0.66;0.83;1" calcMode="discrete" begin="0.8s" dur="0.9s" fill="freeze"/></rect></clipPath>
<text x="60" y="348" fill="#e8e6e3" font-weight="bold" clip-path="url(#t1)">whoami</text>
<rect x="64" y="331" width="11" height="21" fill="#e8e6e3"><animate attributeName="x" values="64;76;88;100;112;124;138" keyTimes="0;0.16;0.33;0.5;0.66;0.83;1" calcMode="discrete" begin="0.8s" dur="0.9s" fill="freeze"/><set attributeName="opacity" to="0" begin="2.1s"/></rect>
</g>
<g opacity="0"><set attributeName="opacity" to="1" begin="2.3s"/>
<text x="36" y="396"><tspan fill="#d97757">⏺</tspan><tspan fill="#e8e6e3"> Agent engineer at a Shenzhen AI startup.</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="2.6s"/>
<text x="36" y="426"><tspan fill="#e8e6e3">  Focus: </tspan><tspan fill="#e8e6e3" font-weight="bold">agent runtime reliability</tspan><tspan fill="#8a8580"> — the agent ↔ process boundary.</tspan></text></g>

<!-- exchange 2: gh stats -->
<g opacity="0"><set attributeName="opacity" to="1" begin="3.8s"/>
<text x="36" y="486" fill="#8a8580">&gt; </text>
<clipPath id="t2"><rect x="60" y="466" width="0" height="28"><animate attributeName="width" values="0;24;48;72;96;120;144;168;192;220" keyTimes="0;0.11;0.22;0.33;0.44;0.55;0.66;0.77;0.88;1" calcMode="discrete" begin="3.8s" dur="1.1s" fill="freeze"/></rect></clipPath>
<text x="60" y="486" fill="#e8e6e3" font-weight="bold" clip-path="url(#t2)">gh stats tomsen-ai</text>
<rect x="64" y="469" width="11" height="21" fill="#e8e6e3"><animate attributeName="x" values="64;88;112;136;160;184;208;232;256;284" keyTimes="0;0.11;0.22;0.33;0.44;0.55;0.66;0.77;0.88;1" calcMode="discrete" begin="3.8s" dur="1.1s" fill="freeze"/><set attributeName="opacity" to="0" begin="5.2s"/></rect>
</g>

<!-- stats table -->
<g opacity="0"><set attributeName="opacity" to="1" begin="5.4s"/>
<text x="64" y="530" fill="#8a8580" font-size="18">repo</text>
<text x="470" y="530" fill="#8a8580" font-size="18">merged</text>
<text x="630" y="530" fill="#8a8580" font-size="18">in flight</text>
<text x="810" y="530" fill="#8a8580" font-size="18">issues</text>
<line x1="60" y1="544" x2="920" y2="544" stroke="#3d3a37" stroke-width="2"/></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="5.6s"/>
<text x="64" y="576" fill="#6cb6ff">qwen-code</text><text x="492" y="576" fill="#3fb950" font-weight="bold">1</text><text x="666" y="576" fill="#8a8580">–</text><text x="832" y="576" fill="#e8e6e3">1</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="5.75s"/>
<text x="64" y="608" fill="#6cb6ff">omnigent</text><text x="492" y="608" fill="#3fb950" font-weight="bold">5</text><text x="666" y="608" fill="#f2cc60">8</text><text x="832" y="608" fill="#e8e6e3">12</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="5.9s"/>
<text x="64" y="640" fill="#6cb6ff">OpenHands SDK</text><text x="492" y="640" fill="#3fb950" font-weight="bold">2</text><text x="666" y="640" fill="#f2cc60">4</text><text x="832" y="640" fill="#e8e6e3">3</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="6.05s"/>
<text x="64" y="672" fill="#6cb6ff">OpenHands</text><text x="492" y="672" fill="#3fb950" font-weight="bold">1</text><text x="666" y="672" fill="#f2cc60">1</text><text x="832" y="672" fill="#8a8580">–</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="6.2s"/>
<text x="64" y="704" fill="#6cb6ff">open-design</text><text x="492" y="704" fill="#8a8580">–</text><text x="666" y="704" fill="#f2cc60">6</text><text x="832" y="704" fill="#8a8580">–</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="6.45s"/>
<line x1="60" y1="718" x2="920" y2="718" stroke="#3d3a37" stroke-width="2"/>
<text x="64" y="748" fill="#e8e6e3" font-weight="bold">total</text><text x="492" y="748" fill="#3fb950" font-weight="bold">9</text><text x="666" y="748" fill="#f2cc60" font-weight="bold">19</text><text x="832" y="748" fill="#e8e6e3" font-weight="bold">16</text></g>

<!-- resting prompt -->
<g opacity="0"><set attributeName="opacity" to="1" begin="7.2s"/>
<rect x="850" y="770" width="0" height="0" fill="none"/>
<text x="936" y="780" fill="#6a6560" font-size="14" text-anchor="end">github.com/tomsen-ai</text>
<text x="36" y="782" fill="#8a8580">&gt; </text>
<rect x="62" y="765" width="11" height="21" fill="#e8e6e3"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="7.2s" repeatCount="indefinite"/></rect></g>
</svg>
