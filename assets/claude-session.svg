<g opacity="0"><set attributeName="opacity" to="1" begin="3.7s"/>
<text x="36" y="310"><tspan fill="#8a8580">     </tspan><tspan fill="#6cb6ff">omnigent       </tspan><tspan fill="#3fb950" font-weight="bold">5 merged</tspan><tspan fill="#e8e6e3"> · harness runtime · kimi/qwen native forwarders</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="3.9s"/>
<text x="36" y="336"><tspan fill="#8a8580">     </tspan><tspan fill="#6cb6ff">OpenHands SDK  </tspan><tspan fill="#3fb950" font-weight="bold">2 merged</tspan><tspan fill="#e8e6e3"> · conversation and runtime internals</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="4.1s"/>
<text x="36" y="362"><tspan fill="#8a8580">     </tspan><tspan fill="#6cb6ff">OpenHands      </tspan><tspan fill="#3fb950" font-weight="bold">1 merged</tspan><tspan fill="#e8e6e3"> · agent platform</tspan></text></g>

<!-- tool call 2 -->
<g opacity="0"><set attributeName="opacity" to="1" begin="4.5s"/>
<text x="36" y="400"><tspan fill="#d97757">⏺</tspan><tspan fill="#e8e6e3" font-weight="bold"> Bash</tspan><tspan fill="#8a8580">(gh pr list --author tomsen-ai --state open)</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="4.8s"/>
<text x="36" y="426"><tspan fill="#8a8580">  ⎿  </tspan><tspan fill="#6cb6ff">omnigent</tspan><tspan fill="#e8e6e3"> 8 in flight · </tspan><tspan fill="#6cb6ff">open-design</tspan><tspan fill="#e8e6e3"> 6 in flight, </tspan><tspan fill="#3fb950">3 approved</tspan><tspan fill="#e8e6e3"> · 12 issues filed</tspan></text></g>

<!-- read -->
<g opacity="0"><set attributeName="opacity" to="1" begin="5.2s"/>
<text x="36" y="464"><tspan fill="#d97757">⏺</tspan><tspan fill="#e8e6e3" font-weight="bold"> Read</tspan><tspan fill="#8a8580">(~/HOW_I_WORK.md)</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="5.5s"/>
<text x="36" y="490"><tspan fill="#8a8580">  ⎿  </tspan><tspan fill="#e8e6e3">1. </tspan><tspan fill="#e8e6e3" font-weight="bold">Daily-drive what you patch</tspan><tspan fill="#8a8580"> — every fix starts from my own stack trace</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="5.7s"/>
<text x="36" y="516"><tspan fill="#8a8580">     </tspan><tspan fill="#e8e6e3">2. </tspan><tspan fill="#e8e6e3" font-weight="bold">Issue first, minimal diff</tspan><tspan fill="#8a8580"> — root cause in the issue, surgical PR</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="5.9s"/>
