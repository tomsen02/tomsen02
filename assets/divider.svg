<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 10">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C9A96E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5EBD0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F5EBD0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F5EBD0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect y="4.5" width="1000" height="1" fill="url(#hair)"/>
  <g>
    <rect y="4" width="90" height="2" rx="1" fill="url(#spark)"/>
    <animateTransform attributeName="transform" type="translate" from="-90 0" to="1010 0" dur="6s" repeatCount="indefinite"/>
  </g>
</svg>
